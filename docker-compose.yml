services:
  # PostgreSQL with PostGIS extension
  postgres:
    image: postgis/postgis:15-3.3
    container_name: fieldops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-fieldops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fieldops_secret}
      POSTGRES_DB: ${DB_NAME:-fieldops_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-fieldops} -d ${DB_NAME:-fieldops_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fieldops_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: fieldops_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-fieldops_redis_secret}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-fieldops_redis_secret}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD:-fieldops_redis_secret}" ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fieldops_network

  # NestJS API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: fieldops_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-fieldops_redis_secret}
      BULL_REDIS_HOST: redis
      BULL_REDIS_PORT: ${REDIS_PORT:-6379}
      NODE_ENV: production
      CORS_ORIGINS: "${CORS_ORIGINS}"
    ports:
      - '${APP_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_uploads:/app/uploads
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3001/api/v1/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fieldops_network

  # Next.js Admin Web
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: fieldops_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
      NEXT_PUBLIC_WS_URL: http://api:3001
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - fieldops_network

volumes:
  postgres_data:
  redis_data:
  api_uploads:

networks:
  fieldops_network:
    driver: bridge
